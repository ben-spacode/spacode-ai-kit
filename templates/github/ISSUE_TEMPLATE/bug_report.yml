name: 🐞 Bug
description: Report a bug
labels: [bug]
body:
  - type: dropdown
    id: env
    attributes: { label: Environment, options: [production, staging, development, local] }
    validations: { required: true }
  - type: dropdown
    id: severity
    attributes: { label: Severity, options: ["S1 - down / data leak / payments", "S2 - major feature broken", "S3 - degraded", "S4 - minor"] }
    validations: { required: true }
  - type: input
    id: tenant
    attributes: { label: Tenant / client (if relevant) }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected vs actual }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Logs / screenshots / requestId, description: "No secrets or personal data" }
