name: Full Pipeline

# Full test level + deploy, for develop / staging / main.
# GitHub is the only path to Railway: this workflow deploys after verification.
#   develop → Railway "development" · staging and hotfix/* → "staging" · main → "production" (requires approval
#   configured on the GitHub Environment "production": Settings → Environments → Required reviewers).
# Railway autodeploy must be OFF for services deployed by this workflow.
on:
  push:
    branches: [develop, staging, main, "hotfix/**"]   # hotfix branches are verified on the staging environment

concurrency:
  group: pipeline-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ENV_NAME: ${{ github.ref_name == 'main' && 'production' || ((github.ref_name == 'staging' || startsWith(github.ref_name, 'hotfix/')) && 'staging' || 'development') }}

jobs:
  full-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://app:app@localhost:5432/app_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate:deploy
      - run: pnpm test -- --coverage              # unit
      - run: pnpm test:integration                # integration + tenant isolation
      - run: pnpm test:contract --if-present      # API contract vs OpenAPI
      - run: pnpm build
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: pnpm audit --audit-level=high
      - name: OSV scan
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --recursive
            ./

  deploy:
    needs: full-verify
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || ((github.ref_name == 'staging' || startsWith(github.ref_name, 'hotfix/')) && 'staging' || 'development') }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        run: echo "{\"commit\":\"${{ github.sha }}\",\"ref\":\"${{ github.ref_name }}\"}" > version.json
      - name: Deploy services to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}   # project token scoped to this environment
        run: |
          npm i -g @railway/cli
          for svc in ${{ vars.RAILWAY_SERVICES }}; do      # e.g. "web engine worker agents"
            echo "▶ deploying $svc to $ENV_NAME"
            railway up --ci --service "$svc" --environment "$ENV_NAME"
          done
      - name: Wait for new version to be live
        run: |
          for i in $(seq 1 60); do
            live=$(curl -fsS "${{ vars.WEB_URL }}/version.json" 2>/dev/null | grep -o '"commit":"[^"]*"' | cut -d'"' -f4 || true)
            api=$(curl -fsS -o /dev/null -w '%{http_code}' "${{ vars.API_URL }}/health/ready" || true)
            if [ "$live" = "${{ github.sha }}" ] && [ "$api" = "200" ]; then echo "live: $live"; exit 0; fi
            sleep 15
          done
          echo "::error::New version not live after 15 minutes"; exit 1

  full-e2e:
    needs: deploy
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    environment: ${{ (github.ref_name == 'staging' || startsWith(github.ref_name, 'hotfix/')) && 'staging' || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      - name: E2E + regression + accessibility (axe) + visual + cross-browser
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: ${{ vars.WEB_URL }}
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: playwright-report, retention-days: 14 }

  full-nonfunctional:
    needs: deploy
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    environment: ${{ (github.ref_name == 'staging' || startsWith(github.ref_name, 'hotfix/')) && 'staging' || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse CI (performance, a11y, best practices, SEO ≥ 90)
        run: |
          npm i -g @lhci/cli
          lhci autorun --config=lighthouserc.json --collect.url="${{ vars.WEB_URL }}/" ${{ vars.LIGHTHOUSE_EXTRA_URLS }}
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Load smoke (k6)
        uses: grafana/run-k6-action@v1
        env: { BASE_URL: "${{ vars.API_URL }}" }
        with: { path: tests/load/smoke.js }
      - name: DAST — OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.WEB_URL }}
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false

  production-smoke:
    needs: deploy
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --grep @smoke --project=chromium
        env: { E2E_BASE_URL: "${{ vars.WEB_URL }}" }
